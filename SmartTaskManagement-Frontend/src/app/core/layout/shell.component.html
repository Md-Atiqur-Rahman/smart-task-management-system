<a class="skip-link" href="#main">Skip to content</a>
<div class="shell">
  <aside id="app-nav" class="sidebar" [class.open]="menuOpen()">
    <div class="brand-row">
      <span class="brand">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#5EEAD4"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="4"></rect>
          <path d="M8 12l3 3 5-6"></path>
        </svg>
        SmartTask
      </span>
      <button
        type="button"
        class="icon-btn close-btn"
        aria-label="Close menu"
        (click)="closeMenu()"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <nav aria-label="Main" class="nav">
      @for (item of navItems(); track item.path) {
        <a
          class="nav-link"
          [routerLink]="item.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
          >{{ item.label }}</a
        >
      }
    </nav>
    <div class="user-block">
      <div class="user">
        <span class="avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="user-text">
          <span class="user-name">{{ user()?.fullName }}</span>
          <span class="user-role">{{ roleText() }}</span>
        </span>
      </div>
      <button type="button" class="nav-link" (click)="logout()">Log out</button>
    </div>
  </aside>
  @if (menuOpen()) {
    <button type="button" class="backdrop" aria-label="Close menu" (click)="closeMenu()"></button>
  }
  <div class="main">
    <header class="topbar">
      <button
        type="button"
        class="icon-btn menu-btn"
        aria-label="Open menu"
        aria-controls="app-nav"
        [attr.aria-expanded]="menuOpen()"
        (click)="openMenu()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <span class="topbar-brand">SmartTask</span>
      <span class="spacer"></span>
      <app-notification-bell />
    </header>
    <main id="main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
<app-toast-host />
