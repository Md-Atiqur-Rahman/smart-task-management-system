<app-auth-layout>
  <form
    class="card auth-card"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
    aria-labelledby="signin-title"
  >
    <div class="auth-heading">
      <h1 id="signin-title">Sign in</h1>
      <p class="muted">Welcome back. Use your work email.</p>
    </div>

    @if (sessionEnded()) {
      <div class="alert alert-info" role="status">
        Your session has ended. Please sign in again.
      </div>
    }
    @if (error(); as message) {
      <div class="alert alert-error" role="alert">{{ message }}</div>
    }

    <div class="field">
      <label class="label" for="email">Email</label>
      <input
        class="input"
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="!!controlError(form.controls.email, 'Email')"
        aria-describedby="email-error"
      />
      <span class="error" id="email-error">{{ controlError(form.controls.email, 'Email') }}</span>
    </div>

    <div class="field">
      <label class="label" for="password">Password</label>
      <div class="password-row">
        <input
          class="input"
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="!!controlError(form.controls.password, 'Password')"
          aria-describedby="password-error"
        />
        <button
          type="button"
          class="btn"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}<span class="sr-only"> password</span>
        </button>
      </div>
      <span class="error" id="password-error">{{
        controlError(form.controls.password, 'Password')
      }}</span>
    </div>

    <button type="submit" class="btn btn-primary full" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
    <p class="muted center">New here? <a routerLink="/register">Create an account</a></p>
  </form>
</app-auth-layout>
